name: Auto Host Assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets_manifest.json'
      - 'sync_assets.py'

permissions:
  contents: write

jobs:
  download-and-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run asset fetcher
        run: python sync_assets.py

      - name: Commit and push images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add microscope/
          git commit -m 'Auto-host all microscope assets' || exit 0
          git push origin main
